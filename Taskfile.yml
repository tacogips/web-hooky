version: '3'

vars:
  PROJECT_NAME: web-hooky

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install dependencies
    cmds:
      - bun install

  dev:
    desc: Run in development mode with watch
    cmds:
      - bun run dev

  build:
    desc: Build the server bundle and the admin UI
    cmds:
      - bun run build

  build-ui:
    desc: Build the SolidJS admin UI into dist/admin-ui
    cmds:
      - bun run build:ui

  start:
    desc: Run the application
    cmds:
      - bun run start

  test:
    desc: Run tests with bun test
    cmds:
      - bun run test

  test-watch:
    desc: Run tests in watch mode with bun test
    cmds:
      - bun run test:watch

  typecheck:
    desc: Run TypeScript type checking
    cmds:
      - bun run typecheck

  fmt:
    desc: Format code with Biome
    cmds:
      - bun run format

  fmt-check:
    desc: Check code formatting
    cmds:
      - bun run format:check

  lint:
    desc: Run all lints (Biome check + format check + typecheck)
    cmds:
      - bun run lint:biome
      - task: fmt-check
      - task: typecheck

  gitleaks:
    desc: Scan staged changes for secrets before commit
    cmds:
      - gitleaks git --pre-commit --redact --staged --verbose

  install-git-hooks:
    desc: Install the Nix-managed pre-commit hook configuration
    cmds:
      - nix develop -c pre-commit install --install-hooks

  clean:
    desc: Clean build artifacts
    cmds:
      - bun run clean

  ci:
    desc: Run all CI checks
    cmds:
      - bun run lint:biome
      - task: fmt-check
      - task: typecheck
      - task: test
      - task: build
