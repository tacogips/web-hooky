[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webhooky-client"
version = "0.1.0"
description = "Client library and CLI for a web-hooky server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "web-hooky" }]
keywords = ["webhook", "web-hooky", "client", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "httpx>=0.27",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/tacogips/web-hooky"
Repository = "https://github.com/tacogips/web-hooky"

[project.scripts]
webhooky = "webhooky.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webhooky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
